name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # v5, not v4: the v4 releases of both actions declare a Node 20 runtime,
      # which GitHub has deprecated and now silently forces onto Node 24. The
      # run stays green and prints a warning — until the fallback goes away,
      # at which point every job on this repository fails at checkout, for a
      # reason nothing in this repository changed.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright-core, not playwright: the repository depends only on
      # playwright-core, so `npx playwright` fetched whatever release is newest
      # and installed a Chromium build this pinned version cannot find.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      # Built before the tests so test/guardrails/dist-smoke.test.ts runs
      # rather than skipping — it is the only check that touches the artefact
      # users actually install.
      - run: npm run build
      # test/baseline/local-only-pixels.test.ts byte-compares a rendered PNG
      # against a committed baseline. The first real CI run proved this is
      # not portable even within "Windows": the pages windows-latest
      # rendered were visually identical to the committed baselines — same
      # layout, same glyphs — and still failed byte-for-byte, because
      # rasterisation differs across Chromium builds on different machines,
      # not only across platforms. There is now no runner this file passes
      # on that isn't the machine the baseline was approved on, so it is
      # excluded everywhere; see the file's own header for why a tolerant
      # pixel-diff isn't the fix either. Every other check in test/baseline/
      # is not rasterisation-dependent and runs on all three platforms same
      # as the rest of the suite.
      - run: npx vitest run --exclude 'test/baseline/local-only-pixels.test.ts'

  # The install a colleague actually does, on a machine that has never seen
  # Chromium: the packed tarball into an empty project, then one build, with
  # the browser cache pointed at an empty folder so the first run has to
  # install the browser itself. The suite above cannot see this: it runs on
  # a runner that already has the browser, and the one bug this job exists
  # for (a path check that looked for the full browser when a headless run
  # opens the headless shell) passed every unit test and showed up only here.
  fresh-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only the system libraries, never the browser: installing the browser
      # here would hide exactly what the job checks.
      - if: runner.os == 'Linux'
        run: npx playwright-core install-deps chromium
      - run: npm pack --pack-destination "${{ runner.temp }}"
      - name: Install into an empty project and build without a browser present
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/no-browsers-yet
        run: |
          mkdir -p "$RUNNER_TEMP/fresh" && cd "$RUNNER_TEMP/fresh"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/tebin-documentor-*.tgz
          printf '# Note\n\nA first build on a fresh machine.\n' > note.md
          npx documentor build note.md --to pdf,docx --theme tebin | tee build.log
          grep -q 'not installed yet — installing it now' build.log
          test -s note.tebin.pdf && test -s note.tebin.docx
          npx documentor doctor
