name: Release

# A version tag publishes the package as a GitHub Release asset, built here.
#
# This is how a colleague installs documentor, because installing straight
# from git globally cannot work: `npm install -g github:4aykas/documentor`
# runs the build in a clone with npm's global flag still set, so the nested
# install that should fetch TypeScript installs nothing into the clone, and
# `tsc` is not found. A tarball needs no build on the installing machine at
# all. The asset keeps one name across versions so that
# releases/latest/download/tebin-documentor.tgz always means the newest.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
          # No `cache: npm`: see the test job in ci.yml.
      # npm 11, for the devEngines pin; see the CI workflow for why.
      - run: npm install -g npm@11
        working-directory: ${{ runner.temp }}
      - run: npm ci
      # The tag must name the version package.json ships, or "latest" would
      # hand out a tarball that calls itself something else.
      - run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      # The same browser install the CI workflow uses, so the suite can run
      # here too: a tag used to publish on typecheck alone, and prepublishOnly
      # guards `npm publish`, not `npm pack`.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run --exclude 'test/baseline/local-only-pixels.test.ts'
      - run: npm pack && mv tebin-documentor-*.tgz tebin-documentor.tgz
      # The exact tarball this release is about to publish, installed into an
      # empty project with an empty browser cache, as the CI workflow's
      # fresh-install job does. A tag push does not wait for that workflow,
      # and the bug that job was written for passed every unit test and
      # showed up only on a clean machine.
      - name: Install the tarball into an empty project and build without a browser present
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/no-browsers-yet
        run: |
          mkdir -p "$RUNNER_TEMP/fresh" && cd "$RUNNER_TEMP/fresh"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/tebin-documentor.tgz"
          printf '# Note\n\nA first build on a fresh machine.\n' > note.md
          npx documentor build note.md --to pdf,docx --theme tebin | tee build.log
          grep -q 'not installed yet — installing it now' build.log
          test -s note.tebin.pdf && test -s note.tebin.docx
          npx documentor doctor
      - run: gh release create "$GITHUB_REF_NAME" tebin-documentor.tgz --title "documentor $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
